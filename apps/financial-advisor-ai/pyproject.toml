[tool.poetry]
name = "financial-advisor-ai"
version = "0.1.0"
description = "AI Financial Advisor with RAG capabilities using Google ADK"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "financial_advisor_ai"}]

[tool.poetry.dependencies]
python = "^3.9"
# Google ADK dependencies (latest stable version)
google-adk = "^1.0.0"

# Core RAG dependencies
faiss-cpu = "^1.7.4"  # Use faiss-gpu if you have CUDA support
sentence-transformers = "^2.2.2"
numpy = "^1.21.0"

# Document processing
PyPDF2 = "^3.0.1"
pdfplumber = "^0.9.0"
python-docx = "^0.8.11"
beautifulsoup4 = "^4.11.1"
pandas = "^1.5.0"

# Optional: Advanced embedding providers
openai = {version = "^1.0.0", optional = true}
cohere = {version = "^4.0.0", optional = true}

# Utilities
typing-extensions = "^4.0.0"
aiohttp = "^3.12.2"
python-dotenv = "^1.1.0"

[tool.poetry.extras]
openai = ["openai"]
cohere = ["cohere"]
gpu = ["faiss-gpu"]
all = ["openai", "cohere"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
financial-advisor = "financial_advisor_ai.main:main"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["financial_advisor_ai"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "PyPDF2.*",
    "pdfplumber.*",
    "docx.*",
    "google.adk.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=financial_advisor_ai",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80"
] 