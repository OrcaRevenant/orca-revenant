[tool.poetry]
name = "financial-advisor-ai"
version = "0.1.0"
description = "A financial advisor AI application"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "financial_advisor_ai"}]

[tool.poetry.dependencies]
python = "^3.9"
google-adk = "^0.1.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"
flake8 = "^6.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
financial-advisor = "financial_advisor_ai.main:main"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py" 