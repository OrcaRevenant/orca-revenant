services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    networks:
      - orca-revenant-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_HOST=${REDIS_HOST:-redis-server}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Override localhost addresses for Docker network
      - DATABASE_URL=postgresql://supabase_admin:uT5jT6Wds9VhB2lMtJ8oaBtB6Kx22rLgUvfTJHat1qsOrChT695hR7b0aohWlJsj@supabase-db:5432/postgres
      - SUPABASE_URL=http://orca-revenant-supabase-network:54321
      - SUPABASE_SERVICE_SECRET=01ff07d4598e7fe1ced2f9bf42ae42108acff7e99ac23199dca15e4c2071e227
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NTU5ODI4MDAsImV4cCI6MTkxMzc0OTIwMH0.gss_ZR8HjRtiyTGXT3WfrgTENOlj2lD77fJBinmeZMw
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzU1OTgyODAwLCJleHAiOjE5MTM3NDkyMDB9.ttP63Al4AAJYZD8qF1Ph9HM6-dqiofeFK1Znkzlzckc
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orca-revenant-network
      - orca-revenant-supabase-network
    # Add healthcheck for backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  orca-revenant-network:
    driver: bridge
  orca-revenant-supabase-network:
    external: true
