services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    networks:
      - orca-revenant-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Keep NODE_ENV as you had it
      - NODE_ENV=${NODE_ENV:-production}

      # ---- Connectivity inside Docker ----
      # Use Docker service names, not localhost and not network names
      - REDIS_HOST=${REDIS_HOST:-redis-server}
      - REDIS_PORT=${REDIS_PORT:-6379}

      # Point to Supabase Postgres service (service name is "db" in your Supabase compose)
      - DATABASE_URL=postgresql://postgres:your-super-secret-and-long-postgres-password@db:5432/postgres

      # Point to Supabase Kong gateway (service name typically "supabase-kong")
      # If your Supabase stack uses "kong" instead, change to http://kong:8000
      - SUPABASE_URL=http://supabase-kong:8000

      # These should match your Supabase .env
      - SUPABASE_SERVICE_SECRET=your-super-secret-jwt-token-with-at-least-32-characters-long
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # Your app's own internal network (for redis)
      - orca-revenant-network
      # Shared external network where Supabase services live
      - orca-revenant-supabase-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  orca-revenant-network:
    driver: bridge

  # This must already exist and be the same network your Supabase stack uses
  orca-revenant-supabase-network:
    external: true
